<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>GA-EFB Dashboard</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Dashboard">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-180.png" type="image/png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <!-- GA-EFB's owner dashboard: sales, customers, Stripe and licence keys. Only the owner's
       account gets any answers from the account service; anyone else just sees "not the owner". -->
  <main id="app" class="wrap" aria-live="polite">
    <p class="loading">Loading…</p>
  </main>

  <template id="signin">
    <section class="signin">
      <img class="signin-icon" src="icon-180.png" alt="" width="84" height="84">
      <h1>GA-EFB Dashboard</h1>
      <p class="dim">Sign in with your GA-EFB account.</p>
      <form>
        <div class="group fields">
          <input name="email" type="email" placeholder="Email" autocomplete="username" required>
          <input name="password" type="password" placeholder="Password" autocomplete="current-password" required>
        </div>
        <p class="error" hidden></p>
        <button class="primary" type="submit">Sign In</button>
      </form>
    </section>
  </template>

  <script src="dashboard.js"></script>
</body>
</html>
