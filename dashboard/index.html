<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>GA-EFB Dashboard</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Dashboard">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-180.png" type="image/png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <!-- GA-EFB's owner dashboard: subscriptions, customers, licence keys and usage, laid out like
       the Junior Club Hub's Platform Admin. Only the owner's
       account gets any answers from the account service; anyone else just sees "not the owner". -->
  <main id="app" aria-live="polite">
    <p class="loading">Loading…</p>
  </main>

  <template id="signin">
    <div class="center">
      <a class="round" href="../" aria-label="Back to the GA-EFB website" title="GA-EFB website">
        <svg class="i big" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <form class="card">
        <img class="app-icon" src="icon-180.png" alt="" width="48" height="48">
        <h1>GA-EFB Dashboard</h1>
        <p class="lede">Subscriptions, customers and usage. Sign in with your GA-EFB account.</p>
        <div class="form" style="padding:12px 0 0">
          <label for="signin-email">Email</label>
          <input class="field" id="signin-email" name="email" type="email" autocomplete="username" autocapitalize="off" required>
          <label for="signin-password">Password</label>
          <input class="field" id="signin-password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <p class="error" hidden></p>
        <button class="primary" type="submit">Sign In</button>
      </form>
    </div>
  </template>

  <script src="dashboard.js"></script>
</body>
</html>
